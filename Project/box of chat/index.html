<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Ventanas Flotantes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="mainMenuBtn" class="corner-btn left-btn">☰</button>
    <button id="historyBtn" class="corner-btn right-btn">🕒</button>

    <div class="app-container">
        <main class="chat-area">
            <div class="chat_user">
                <div class="user-info">
                    <img src="janky.png" alt="Avatar" id="currentAvatar" onerror="this.src='https://via.placeholder.com/40'">
                    <span id="currentName">Janky Liendo</span>
                </div>
            </div>

            <div class="chat_content" id="messageContainer">
                </div>
            
            <div class="chat_input_area">
                <input type="text" id="messageInput" placeholder="Escribe un mensaje...">
                <button id="sendBtn">➤</button>
            </div>
        </main>
    </div>

    <div id="menuWindow" class="floating-window window-left">
        <div class="window-header">
            <h3>Menú</h3>
            <button class="close-btn" id="closeMenuBtn">×</button>
        </div>
        <div class="window-content">
            <ul class="nav-list" id="mainMenu">
                <li class="active" data-nav="home">🏠 Inicio</li>
                <li data-nav="settings">⚙️ Configuración</li>
                <li data-nav="profile">👤 Perfil</li>
                <li data-nav="darkmode">🌑 Modo Oscuro</li>
            </ul>
        </div>
    </div>

    <div id="historyWindow" class="floating-window window-right">
            <div class="window-header">
            <h3>Chats Recientes</h3>
            <button class="close-btn" id="closeHistoryBtn">×</button>
        </div>
        <div class="window-content">
            <ul class="chat-history" id="chatHistoryList">
                <li class="active" data-chat-id="1">
                    <img src="janky.png" alt="JL" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                    <div class="avatar-placeholder" style="display:none">JL</div>
                    <div>
                        <strong>Janky Liendo</strong>
                        <p>Lorem ipsum dolor...</p>
                    </div>
                </li>
                <li data-chat-id="2">
                    <div class="avatar-placeholder">MG</div>
                    <div>
                        <strong>Maria Garcia</strong>
                        <p>¡Excelente, gracias!</p>
                    </div>
                </li>
                    <li data-chat-id="3">
                    <div class="avatar-placeholder" style="background:#6f2">ST</div>
                    <div>
                        <strong>Soporte</strong>
                        <p>Ticket resuelto.</p>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
